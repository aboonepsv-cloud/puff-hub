<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puff Store Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><img src="logo.png" alt="Puff Super Value Hub" style="width:100%; max-width:200px; border-radius:8px;"></div>
      <nav>
        <a href="#" data-page="lottery" class="active">Lottery</a>
        <a href="#" data-page="schedules">Schedules</a>
        <a href="#" data-page="timesheets">Timesheets</a>
        <a href="#" data-page="pricing">Pricing / Promos</a>
        <a href="#" data-page="item-search">Item Search</a>
        <a href="#" data-page="people">People Docs</a>
      </nav>
      <div class="store-info">
        <label for="storeSelect">Store:</label>
        <select id="storeSelect">
          <option value="4">4 — Juniata</option>
          <option value="7">7 — Bellwood</option>
          <option value="17">17 — Mt. Joy</option>
        </select>
      </div>
    </aside>

    <main class="content">
      <div id="page-lottery" class="page active">
        <div class="sheet-header">
          <h2>Daily Instant Ticket</h2>
          <p id="sheetStore">4 Juniata</p>
        </div>
        <iframe id="lotteryFrame" class="sheet-frame" src="" frameborder="0"></iframe>
      </div>

      <div id="page-schedules" class="page"><h1>Schedules</h1><p>Coming next.</p></div>
      <div id="page-timesheets" class="page"><h1>Timesheets</h1><p>Coming next.</p></div>
      <div id="page-pricing" class="page"><h1>Pricing / Promos</h1><p>Coming next.</p></div>
      <div id="page-item-search" class="page"><h1>Item Search</h1><p>Coming next.</p></div>
      <div id="page-people" class="page"><h1>People Docs</h1><p>Coming next.</p></div>
    </main>

    <aside class="chat-panel">
      <div class="chat-header"><span>Store Chat</span><button id="toggleChat">–</button></div>
      <div class="chat-messages" id="chatMessages">
        <div class="message office">Office: Good morning.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message…">
        <button id="sendChat">Send</button>
      </div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
